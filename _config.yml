remote_theme: pages-themes/dinky@v0.2.0

# GitHub Pages force-enables these, but a local build does not -- without them
# {% seo %} in the layout is an unknown tag and the build fails. Both are on
# the Pages plugin allowlist, so declaring them changes nothing in production.
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  # Pages enables this one whether or not it is listed. It is here so a local
  # build behaves the same: it lifts a page's first heading into page.title,
  # which changes what jekyll-seo-tag emits.
  - jekyll-titles-from-headings
  # Not one of the Pages defaults, unlike the three above: without this there
  # is no /sitemap.xml at all.
  - jekyll-sitemap

title: ARQ-COMP
description: Competition on Automated Reasoning for Quantum

# The Google Form behind the call for problems/benchmarks/comments. Kept here
# rather than inline in the page so that replacing the form is a one-line
# change in one place.
form_url: https://forms.gle/9AzNbS1FyJps6jRk6

# Social preview. jekyll-seo-tag turns page.image into og:image and
# twitter:image and makes it absolute against the url below; without it a shared
# link renders as a bare text card. Set through Jekyll's defaults so it applies
# to every page, since seo-tag reads page.image and not a site-level key. A page
# can still override it in its own front matter.
#
# 1200x630 rather than the square logo that was here first. That is the size
# every platform crops toward, so a square either gets letterboxed or has its
# edges taken off; this card is composed for the shape, with the sphere, the
# wordmark and the tagline. Declaring the dimensions lets a crawler lay out the
# card before it has fetched the image.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/social-card.png
        width: 1200
        height: 630

# Without this, jekyll-seo-tag emits twitter:card = summary, which renders the
# thumbnail small and square and wastes a card built for 1200x630.
twitter:
  card: summary_large_image

# On Pages this is supplied by site.github, so canonical and og:url are already
# correct in production. Setting it explicitly makes a local build emit the same
# absolute URLs instead of bare "/".
url: https://arq-comp.github.io

# This list used to carry nine logo files, and it defaulted to publishing: a
# new draft dropped in the wrong directory would have gone live until somebody
# noticed and added a line. Artwork is now split by directory instead --
# assets/img/ is published, _design/ never is, because Jekyll ignores
# directories whose names begin with an underscore -- so there is nothing left
# to remember. Only README.md still needs naming.
#
# Jekyll concatenates this with its own defaults rather than replacing them, so
# Gemfile and friends stay excluded.
exclude:
  # Repository documentation, not site content. Without this, GitHub Pages'
  # jekyll-optional-front-matter would publish it at /README.html.
  - README.md
