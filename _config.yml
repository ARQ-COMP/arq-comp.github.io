remote_theme: pages-themes/dinky@v0.2.0

# GitHub Pages force-enables these, but a local build does not -- without them
# {% seo %} in the layout is an unknown tag and the build fails. Both are on
# the Pages plugin allowlist, so declaring them changes nothing in production.
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

title: ARQ-COMP
description: Competition on Automated Reasoning for Quantum

# Superseded drafts of the logo. They are kept in the repository for
# reference, but without this they are copied into the build and served
# publicly -- about 5.5 MB of abandoned artwork at /logo/.
# Jekyll concatenates this with its own defaults rather than replacing them,
# so Gemfile and friends stay excluded.
exclude:
  # Repository documentation, not site content. Without this, GitHub Pages'
  # jekyll-optional-front-matter would publish it at /README.html.
  - README.md

  - logo/logo1.png
  - logo/logo2.png
  - logo/logo3.png
  - logo/logo4.png
  - logo/logo5.png
  - logo/logo6.png
