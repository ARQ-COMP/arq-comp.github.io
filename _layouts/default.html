<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">

    <!-- Applies a stored theme choice before first paint, so dark-mode
         visitors never see a flash of the light page. Must stay inline. -->
    <script>(function(){try{var t=localStorage.getItem('arq-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>

{% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- The Bloch sphere from the logo, cropped away from the wordmark, which
         is unreadable at these sizes. Two variants because the mark is dark
         artwork: it disappears against a dark browser chrome. `media` on an
         icon link is honoured by Chromium and Firefox; anything that ignores
         it falls back to the first match, so the light pair is listed first. -->
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" href="{{ '/assets/icons/favicon-32-light.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="180x180" media="(prefers-color-scheme: light)" href="{{ '/assets/icons/icon-180-light.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="{{ '/assets/icons/favicon-32-dark.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="180x180" media="(prefers-color-scheme: dark)" href="{{ '/assets/icons/icon-180-dark.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">

    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1 class="header">{{ site.title | default: site.github.repository_name }}</h1>
        <p class="header">{{ site.description | default: site.github.project_tagline }}</p>

        <ul class="nav">
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/submit-benchmarks/' | relative_url }}">Submit Benchmarks</a></li>
        </ul>

        <!-- This row always has the GitHub link in it, so it is never empty.
             Only the theme button is hidden until scripted: without JS the page
             still follows the OS via CSS, but the button itself would be inert.
             Its glyph is a placeholder; the script sets the real one, along
             with the accessible name that stands in for the removed text. -->
        <div class="sidebar-actions">
          <a class="icon-button" href="https://github.com/ARQ-COMP"
             aria-label="ARQ-COMP repositories on GitHub"
             title="ARQ-COMP repositories on GitHub">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
          </a>

          <button type="button" id="theme-toggle" class="icon-button" hidden>
            <span class="theme-toggle-icon" aria-hidden="true">&#x2600;&#xFE0E;</span>
          </button>
        </div>
      </header>

      <section>
        {{ content }}
      </section>

      <footer>
        <!-- The -512 files are the web-sized versions; logo6-fixed.png and
             logo6-dark.png are kept alongside as the full-resolution sources.
             Only one of these is ever displayed; display:none keeps the other
             out of the accessibility tree, so the shared alt text is not read
             twice. -->
        <img src="{{ '/logo/logo6-fixed-512.png' | relative_url }}" alt="{{ site.title }} logo" width="512" height="512" class="header-logo logo-light">
        <img src="{{ '/logo/logo6-dark-512.png' | relative_url }}" alt="{{ site.title }} logo" width="512" height="512" class="header-logo logo-dark">
      </footer>
    </div>
    <script>
      // Theme control: a plain Light <-> Dark switch.
      //
      // Until it is used, no data-theme attribute is set and nothing is
      // stored, so prefers-color-scheme decides -- that is the default, and it
      // keeps tracking the OS live. The button only reports which theme is
      // currently in effect; the first click is what makes a choice explicit.
      (function () {
        var KEY = 'arq-theme';
        // U+FE0E is the text variation selector: it keeps the sun a line glyph
        // on platforms that would otherwise substitute a colour emoji.
        var ICONS = { light: '☀︎', dark: '☾' };
        var NAMES = { light: 'Light', dark: 'Dark' };
        var OTHER = { light: 'Dark', dark: 'Light' };

        var btn = document.getElementById('theme-toggle');
        if (!btn) { return; }
        var icon = btn.querySelector('.theme-toggle-icon');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        var stored = null;
        try {
          var s = localStorage.getItem(KEY);
          if (s === 'light' || s === 'dark') { stored = s; }
        } catch (e) {}

        function current() {
          return stored || (prefersDark.matches ? 'dark' : 'light');
        }

        // With the text label gone, the accessible name and the hover tooltip
        // are the only things naming the control -- so both are kept current.
        function render() {
          var mode = current();
          icon.textContent = ICONS[mode];
          btn.setAttribute('aria-label',
            'Colour theme: ' + NAMES[mode] + '. Activate to switch to ' + OTHER[mode] + '.');
          btn.setAttribute('title', 'Switch to ' + OTHER[mode].toLowerCase() + ' theme');
        }

        btn.addEventListener('click', function () {
          stored = current() === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', stored);
          try { localStorage.setItem(KEY, stored); } catch (e) {}
          render();
        });

        // While no choice has been made, the label has to follow the OS.
        prefersDark.addEventListener('change', function () {
          if (!stored) { render(); }
        });

        render();
        btn.hidden = false;
      })();
    </script>
  </body>
</html>
