# Build check only -- this workflow does NOT deploy.
#
# The site is still published by GitHub Pages' own build from `master`, which
# uses Pages' pinned environment (Jekyll 3.10) and ignores the Gemfile. The
# point of this job is that a broken build fails loudly here, instead of
# silently not deploying with no log anyone thinks to look at.
#
# Because the two toolchains differ, a green run here is strong evidence but
# not a guarantee: Liquid, SCSS and content errors are caught, Jekyll 3-vs-4
# edge cases are not.

name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build the site
        # --strict_front_matter turns a malformed front-matter block into a
        # failure rather than a silently skipped page.
        run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production

      - name: Check the homepage was actually generated
        # Guards the failure mode that prompted all this: the homepage
        # previously existed only via a GitHub-only plugin, so the build could
        # "succeed" while producing no index.html at all.
        run: test -s _site/index.html
